[project]
name = "evolyn"
version = "0.1.0"
description = "A modular self-learning AI agent with persistent knowledge, evaluation, and experience-driven improvement."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cognee>=1.5,<2",
    "langfuse>=4.14,<5",
    "litellm>=1.94,<2",
    "mcp[cli]>=2,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
evolyn = "evolyn.cli:main"
evolyn-mcp = "evolyn.tools.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evolyn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
